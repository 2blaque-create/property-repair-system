<!DOCTYPE html>
<html>
<head>
    <title>Property Repair Request</title>
  <style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f7fb;
    color: #222;
}

.topnav {
    background: #111827;
    padding: 15px;
    display: flex;
    gap: 15px;
}

.topnav a {
    color: white;
    text-decoration: none;
    background: #2563eb;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
}

.topnav a:hover {
    background: #1d4ed8;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

h1 {
    margin-top: 0;
    color: #111827;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
}

textarea {
    min-height: 100px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

button:hover {
    background: #1d4ed8;
}
</style>  
</head>
<body>
    <div class="topnav">
    <a href="/">Home</a>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/technician.html">Technician</a>
    <a href="/suppliers.html">Suppliers</a>
</div>

<div class="container">

    <h1>Property Repair Request</h1>
<form id="repairForm" enctype="multipart/form-data">

  <div class="form-group">
    <label>Property Type</label>
    <select name="property_type" required>
        <option value="Complex">Complex</option>
        <option value="House">House</option>
        <option value="Shop">Shop</option>
    </select>
</div>

  <div class="form-group">
    <label>Property Name</label>
    <select name="property_name" id="propertySelect" required>
    <option value="">Select Property</option>
</select>
</div>

  <div class="form-group">
    <label>Address</label>
    <input type="text" name="address" required>

<input type="hidden" name="landlord_name">
<input type="hidden" name="landlord_phone">

<input type="hidden" name="agent_name">
<input type="hidden" name="agent_phone">

<input type="hidden" name="caretaker_name">
<input type="hidden" name="caretaker_phone">

<div class="form-group">
    <label>Unit / House / Shop Number</label>
    <input type="text" name="unit_number" required>
</div>

<div class="form-group">
    <label>Trade</label>
    <select name="trade" required>
        <option value="">Select Trade</option>
        <option value="plumbing">Plumbing</option>
        <option value="electrical">Electrical</option>
        <option value="general_maintenance">General Maintenance</option>
    </select>
    </div>

<div class="form-group">
    <label>Problem Description</label>
    <textarea name="description" required></textarea>
</div>

<div class="form-group">
    <label>Priority</label>
    <select name="priority" required>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
    </select>
</div>

<div class="form-group">
    <label>Availability Date</label>
    <input type="date" name="availability_date">
</div>

<div class="form-group">
    <label>Availability Time</label>
    <input type="time" name="availability_time">
</div>

<div class="form-group">
    <label>Contact Name</label>
    <input type="text" name="contact_name">
</div>

<div class="form-group">
    <label>Designation</label>
    <input type="text" name="designation">
</div>

<div class="form-group">
    <label>Contact Phone</label>
    <input type="text" name="contact_phone">
</div>

<div class="form-group">
    <label>Upload Photo</label>
    <input type="file" name="photo" accept="image/*">
</div>

        <button type="submit">Submit Repair</button>

    </form> 

    <p id="message"></p>

    <script>
        const form = document.getElementById("repairForm");

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const formData = new FormData(form);

            try {
                const response = await fetch("/repairs", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                document.getElementById("message").innerText = result.message;

                if (response.ok) {
                    form.reset();
                }
            } catch (error) {
                document.getElementById("message").innerText = "Error submitting repair";
                console.error(error);
            }
        });

async function loadProperties() {
    try {
        const response = await fetch('/properties');
        const properties = await response.json();

        const select = document.getElementById('propertySelect');

        properties.forEach(property => {
            const option = document.createElement('option');
            option.value = property.property_name;
            option.textContent = property.property_name;
            select.appendChild(option);

        });
         select.addEventListener('change', () => {
    const selected = properties.find(
        p => p.property_name === select.value
    );

    if (selected) {

    document.querySelector('[name="address"]').value =
        selected.address || '';

    document.querySelector('[name="landlord_name"]').value =
        selected.landlord_name || '';

    document.querySelector('[name="landlord_phone"]').value =
        selected.landlord_phone || '';

    document.querySelector('[name="agent_name"]').value =
        selected.agent_name || '';

    document.querySelector('[name="agent_phone"]').value =
        selected.agent_phone || '';

    document.querySelector('[name="caretaker_name"]').value =
        selected.caretaker_name || '';

    document.querySelector('[name="caretaker_phone"]').value =
        selected.caretaker_phone || '';

}
});

    } catch (error) {
        console.error('Error loading properties:', error);
    }
}

loadProperties();
    </script>
</div>
</body>
</html>
